[pytest]
testpaths = tests

# ★ 显式把项目根加进 sys.path，让 tests/ 能 import devtools/。
#   不写这一行其实【目前也能跑】—— 因为 editable 安装产生的
#   _editable_impl_ecom_agent.pth 里恰好有一行指向项目根，顺带把 devtools/
#   也暴露了。但那是【安装方式的副作用】，不是声明过的前提：
#   换一个构建后端（setuptools 的严格 finder 只映射 pyproject 里声明过的包）
#   它就会消失，而且表现为一批测试突然 ImportError。
#   devtools/ 里的探针逻辑现在是 CI 注解的依赖（fatal_lines），值得写明白。
pythonpath = .

# ★ 必须有 asyncio_mode = auto。
#   guardrails/approver.py 的 Web/File 两个通道是 async 的，@pytest.mark.asyncio
#   逐个标记容易漏（漏了的表现为"协程从未被 await"警告 + 用例假通过）。
#   auto 模式下所有 async def 用例自动被接管，没有漏网的可能。
asyncio_mode = auto

# ★ 注册 marker，否则 pytest 对未知 marker 只发警告不报错 ——
#   而警告在多到一定程度后没人看，等于这个分层门禁形同虚设。
#   语义：本地是硬门禁（必须过），CI 是尽力跑（见 .github/workflows/ci.yml 的注释）。
markers =
    needs_browser: 需要真实浏览器进程（本地必跑；CI 尽力跑，失败不阻塞）
