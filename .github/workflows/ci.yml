name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:   # 手动触发，方便只改文档时验证 workflow 本身没坏

jobs:
  # ── 离线门禁：这是硬门禁，红了就是坏了 ────────────────────────────
  offline:
    name: 离线测试（零 token / 零网络 / 零浏览器）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip

      - name: 安装
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: 跑离线测试
        env:
          # ★ 假 key：有些模块的导入期会读它。真值永远不进 CI。
          DEEPSEEK_API_KEY: ci-dummy
          # ★ 空串 = 明确要求 browser-use 自己探测 Chrome，不走开发机的硬编码路径。
          #   注意这里必须是空串而不是"不设置"—— 见 ecom_agent/config.py 的注释。
          ECOM_AGENT_CHROME_PATH: ""
          # 双保险：即使有人误加了 key，这个开关不打开就不会真的联网。
          ECOM_AGENT_ENABLE_LIVE_LLM: "false"
        run: |
          set +e
          # ★ --tb=long + -rf，两个都是为了让【我们自己写的断言消息】活着到达注解：
          #   · 这个项目的断言消息是精心写的诊断文本（往往是好几行的中文），
          #     它们才是真正的失败原因。--tb=short 会把 raise 语句的源码上下文压成
          #     "...<4 lines>..."，而 pytest 默认又不在结尾列失败清单 ——
          #     结果是多个用例同时失败时，tail 只捞得到最后一个的栈。
          #   · -rf 在输出【最末尾】补一份一行一条的失败清单，而注解取的正是 tail ——
          #     于是"有几个挂了、各挂在哪一句"必定落在窗口里。
          #   · 消息在末尾，tail 从末尾取，所以 --tb=long 撑长 traceback 也不会把它挤掉。
          python -m pytest -v -m "not needs_browser" --tb=long -rf 2>&1 | tee /tmp/pytest_offline.log
          code=${PIPESTATUS[0]}
          set -e

          # ★ 把失败原因抬成【注解】，这是本仓库唯一不需要权限就能读到的通道。
          #   实测过：日志接口要 admin 权限（公开仓库也一样），job summary 不进公开 HTML，
          #   公开 run 页面只给 job 名和状态。所以一次红的门禁，
          #   对任何没登录的人（以及把链接发给面试官之后的面试官）来说只有一句
          #   "exit code 1" —— 而"红的原因不可读"正是让人开始忽略 CI 的第一步。
          #   这一条和上面 browser job 的注释是同一个道理，只是发生在 CI 自身这一层。
          #
          #   ★ 为什么可以把输出贴到公开页面：CI 里 DEEPSEEK_API_KEY 是 ci-dummy，
          #     真凭据从不进 CI（见上面 env）。这是 R4 的纪律，也是这一步能成立的前提。
          if [ "$code" -ne 0 ]; then
            MSG=$(tail -n 60 /tmp/pytest_offline.log | sed -e 's/%/%25/g' -e 's/\r//g' | awk '{printf "%s%%0A", $0}')
            echo "::error::离线测试失败（硬门禁）。最后 60 行：${MSG}"
          fi
          exit "$code"

  # ── 浏览器门禁：尽力跑，失败不阻塞 ──────────────────────────────
  #
  # ★ 为什么单独一个 job 且 continue-on-error：
  #   browser-use 要在 CI 里启动真实 Chromium。这依赖 runner 的沙箱设置、
  #   Chrome 版本、以及一组 apt 包，任何一环变化都会让它红 —— 而那是
  #   【环境问题，不是代码问题】。把它和离线门禁混在一个 job 里，
  #   会让"代码坏了"和"CI 机器没配好"看起来一模一样，久而久之没人看 CI。
  #
  # ★ 为什么不干脆不跑：
  #   完全不跑的话，浏览器路径的代码在 CI 上零覆盖，而它恰恰是最容易坏的部分。
  #   "本地是硬门禁，CI 是尽力跑"—— 这个区别明确写出来，比假装 CI 全绿诚实，
  #   也比直接删掉这个 job 负责。
  browser:
    name: 浏览器测试（尽力跑）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip

      - name: 安装
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: 装 Chromium 依赖（失败继续，不影响后续步骤的结论）
        run: |
          sudo apt-get update -qq || true
          sudo apt-get install -y -qq libnss3 libatk-bridge2.0-0 libgtk-3-0 \
            libgbm1 libasound2t64 fonts-noto-cjk || true

      # ★ 先把"环境坏了"和"代码坏了"分开，再跑测试。
      #   没有这一步的话，两种失败在下游长得一模一样：都是 pytest 红一片，
      #   而排查方向完全相反 —— 一个要去改 runner，一个要去改代码。
      #   探测结果用 ::notice:: / ::warning:: / ::error:: 抬成注解，这样它和失败原因一样是公开可读的。
      #
      # ★ 为什么探的是 devtools/probe_browser.py 而不是几行 inline python：
      #   第一版探针只回答了"Chrome 在不在"（答案：在），然后测试照样红，
      #   注解只给到一句 local_browser_watchdog.py:428 的 RuntimeError。
      #   去读库源码才知道为什么补 traceback 没用：
      #     · 那个 RuntimeError 的消息是【硬编码】的通用提示（"可能要 --no-sandbox"），
      #       把 --tb=short 改成 --tb=long 只是把一句我已经读过源码的话打全；
      #     · Chrome 是用 stderr=PIPE 起的（local_browser_watchdog.py:150），
      #       而全库【没有任何一行读这个管道】—— 死因被接了管道却没人听。
      #   所以探针改成"按同样的二进制、同样的 get_args() 自己起一次，自己读 stderr"。
      #   这份脚本本地也能跑，且用的是和测试同一条 Chrome 解析顺序（config.CHROME_PATH）。
      - name: 探测浏览器（把"环境坏了"和"代码坏了"分开）
        run: python devtools/probe_browser.py

      - name: 跑浏览器测试
        env:
          DEEPSEEK_API_KEY: ci-dummy
          ECOM_AGENT_ENABLE_LIVE_LLM: "false"
          # 空串 → browser-use 的 find_chrome_executable() 去找 runner 上已装的 Chrome
          ECOM_AGENT_CHROME_PATH: ""
          ECOM_AGENT_HEADLESS: "true"
        run: |
          set +e
          # ★ 与 offline job 同款参数，理由见那边（--tb=long + -rf 是为了让
          #   自己写的断言消息活着到达注解；pytest 的 "--tb=short 截断"
          #   是这一轮排查里真实踩到的、我自己给自己挖的坑）。
          python -m pytest -v -m "needs_browser" --tb=long -rf 2>&1 | tee /tmp/pytest_browser.log
          code=${PIPESTATUS[0]}
          set -e

          # ★ 失败原因抬成注解 —— 理由同 offline job 那一段。
          #   顺带一个真实的、找了我半天的教训：这个 job 第一次在 CI 上红的时候，
          #   公开 run 页面上只有 "Process completed with exit code 1"，
          #   日志接口回 403 "Must have admin rights to Repository"，
          #   job summary 压根不进公开 HTML。也就是说这份 workflow 当时
          #   把一个它自己都无法解释的失败推给了所有看客。
          #   可观测性不是"日志写得详细"，是【看的人拿得到】。
          if [ "$code" -ne 0 ] && [ "$code" -ne 5 ]; then
            MSG=$(tail -n 80 /tmp/pytest_browser.log | sed -e 's/%/%25/g' -e 's/\r//g' | awk '{printf "%s%%0A", $0}')
            echo "::error::needs_browser 测试失败（退出码 ${code}）。最后 80 行：${MSG}"
          fi

          # ★ 必须显式区分退出码 5（未收集到任何用例）和 1（用例真的失败了）。
          #
          #   踩过的坑：Phase 0 时仓库里还没有任何 needs_browser 用例，pytest 退出码 5
          #   让这个 job 变红 —— 看起来和"Chromium 装不上"一模一样，
          #   但根因完全不同（一个是不该修，一个是环境问题）。
          #   在 CI 上，"红的原因不可分辨"比"红"本身更有害：它会训练人忽略这个 job。
          if [ "$code" -eq 5 ]; then
            echo "::notice::还没有 needs_browser 用例（Phase 2 的 spike 会补上）。退出码 5 = 未收集到用例，不算失败。"
            exit 0
          fi
          exit "$code"

      - name: 把结论写进 job summary（即使失败也执行）
        if: always()
        run: |
          {
            echo "### 浏览器门禁"
            echo ""
            echo "本 job 是 \`continue-on-error: true\`，红不代表代码坏了。"
            echo "本地必须过：\`pytest -m needs_browser\`"
            echo ""
            echo "★ 失败原因在【本页的 Annotations 面板】里，不在日志里 ——"
            echo "日志接口要 admin 权限（公开仓库也一样），job summary 不进公开 HTML，"
            echo "注解是这个仓库唯一公开可读的失败通道。"
          } >> "$GITHUB_STEP_SUMMARY"
