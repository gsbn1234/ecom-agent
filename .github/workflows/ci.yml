name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:   # 手动触发，方便只改文档时验证 workflow 本身没坏

jobs:
  # ── 离线门禁：这是硬门禁，红了就是坏了 ────────────────────────────
  offline:
    name: 离线测试（零 token / 零网络 / 零浏览器）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip

      - name: 安装
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: 跑离线测试
        env:
          # ★ 假 key：有些模块的导入期会读它。真值永远不进 CI。
          DEEPSEEK_API_KEY: ci-dummy
          # ★ 空串在这里是安全的，且理由和 browser job 的钉死【不矛盾】：
          #   这个 job 跑的是 `-m "not needs_browser"`，【从头到尾不会启动浏览器】，
          #   所以"库会挑哪个二进制"这个不确定性压根不进入链路。
          #   空串在这里的作用是明确"不走开发机的硬编码路径"，
          #   而不是"让库自己挑"—— 见 ecom_agent/config.py 的注释。
          #   ⚠️ 如果哪天有人往这个 job 里加了 needs_browser 用例，这里必须同步改成钉死，
          #      否则会撞上 browser job 那个"库挑中没有可用沙箱的 chromium"的坑。
          ECOM_AGENT_CHROME_PATH: ""
          # 双保险：即使有人误加了 key，这个开关不打开就不会真的联网。
          ECOM_AGENT_ENABLE_LIVE_LLM: "false"
        run: |
          set +e
          # ★ -rf：在输出【最末尾】补一份一行一条的失败清单，而注解取的正是 tail ——
          #   于是"有几个挂了、各挂在哪一句"必定落在窗口里。多个用例同时挂时，
          #   没有它，tail 只捞得到最后一个的栈。
          #
          # ⚠️ 这里原先写的是"加上 --tb=long 就能让被截断的消息显示完整"，那是错的。
          #    实测：--tb=long 改完，输出里的 "...<4 lines>..." 逐字未变。
          #    那个截断是【Python 3.11+ 的 traceback 模块自己】对多行语句干的
          #    （任何 pytest 开关都关不掉）。而异常消息本身并没有被截 ——
          #    它照常打印在 "RuntimeError: " 后面同一行。
          #    所以 --tb=long 保留，但理由是"让断言的源码上下文完整"，
          #    不是"解开截断"——后者是个不存在的开关，别再去找了。
          python -m pytest -v -m "not needs_browser" --tb=long -rf 2>&1 | tee /tmp/pytest_offline.log
          code=${PIPESTATUS[0]}
          set -e

          # ★ 把失败原因抬成【注解】，这是本仓库唯一不需要权限就能读到的通道。
          #   实测过：日志接口要 admin 权限（公开仓库也一样），job summary 不进公开 HTML，
          #   公开 run 页面只给 job 名和状态。所以一次红的门禁，
          #   对任何没登录的人（以及把链接发给面试官之后的面试官）来说只有一句
          #   "exit code 1" —— 而"红的原因不可读"正是让人开始忽略 CI 的第一步。
          #   这一条和上面 browser job 的注释是同一个道理，只是发生在 CI 自身这一层。
          #
          #   ★ 为什么可以把输出贴到公开页面：CI 里 DEEPSEEK_API_KEY 是 ci-dummy，
          #     真凭据从不进 CI（见上面 env）。这是 R4 的纪律，也是这一步能成立的前提。
          if [ "$code" -ne 0 ]; then
            MSG=$(tail -n 60 /tmp/pytest_offline.log | sed -e 's/%/%25/g' -e 's/\r//g' | awk '{printf "%s%%0A", $0}')
            echo "::error::离线测试失败（硬门禁）。最后 60 行：${MSG}"
          fi
          exit "$code"

  # ── 浏览器门禁：尽力跑，失败不阻塞 ──────────────────────────────
  #
  # ★ 为什么单独一个 job 且 continue-on-error：
  #   browser-use 要在 CI 里启动真实 Chromium。这依赖 runner 的沙箱设置、
  #   Chrome 版本、以及一组 apt 包，任何一环变化都会让它红 —— 而那是
  #   【环境问题，不是代码问题】。把它和离线门禁混在一个 job 里，
  #   会让"代码坏了"和"CI 机器没配好"看起来一模一样，久而久之没人看 CI。
  #
  # ★ 为什么不干脆不跑：
  #   完全不跑的话，浏览器路径的代码在 CI 上零覆盖，而它恰恰是最容易坏的部分。
  #   "本地是硬门禁，CI 是尽力跑"—— 这个区别明确写出来，比假装 CI 全绿诚实，
  #   也比直接删掉这个 job 负责。
  browser:
    name: 浏览器测试（尽力跑）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    # ★ env 放在 job 层而不是各 step 层 —— 这是本轮排查换来的教训：
    #   之前探针步骤没有 env、测试步骤有一份，于是【两者测的不是同一个浏览器】，
    #   探针报"环境没问题"而测试照红，白烧了两轮 CI。
    #   探针只有在与测试共享同一份环境时才有意义。
    env:
      DEEPSEEK_API_KEY: ci-dummy
      ECOM_AGENT_ENABLE_LIVE_LLM: "false"
      ECOM_AGENT_HEADLESS: "true"
      # ★★ 必须显式钉死，不能让库自己挑。这是本轮 CI 全红的根因，实测证据：
      #
      #    两者不是同一个二进制！探针=/usr/bin/google-chrome / 库=/usr/bin/chromium
      #    FATAL:zygote_host_impl_linux.cc:129] No usable sandbox! If you are running
      #      on Ubuntu 23.10+ ... that has disabled unprivileged user namespaces with
      #      AppArmor ... you can try using --no-sandbox.
      #
      #   原因：库里有【两份不同的清单】回答"哪个 Chrome" ——
      #     · browser/chrome.py:find_chrome_executable() 走 which，优先 google-chrome；
      #     · local_browser_watchdog.py:264-279（真正启动用的那条）是硬编码路径表，
      #       chromium 组优先，于是挑中 /usr/bin/chromium。
      #   而 runner 上的 /usr/bin/chromium 没有可用的沙箱助手（No usable sandbox!），
      #   Google Chrome 的 deb 则带 setuid 的 chrome-sandbox —— 所以同一份参数、
      #   同一个 runner，换一个二进制就从"CDP 就绪"变成 SIGABRT。
      #
      #   ★ 为什么钉 google-chrome 而不是用 chromium_sandbox=False 关掉沙箱：
      #     关沙箱也能过（探针的对照段已在 runner 上验证过），但那是【降低安全姿态】
      #     换绿色 —— 这个项目通篇在讲护栏，为了 CI 变绿去关掉浏览器自己的沙箱，
      #     是本末倒置。钉一个带可用沙箱的二进制，效果一样而不用让步。
      #     真到了 google-chrome 也起不来的那天，探针会报"开/关都起不来"，
      #     那时再考虑 chromium_sandbox=False，且必须在 docs 里写明代价。
      ECOM_AGENT_CHROME_PATH: /usr/bin/google-chrome
      # 让 tests/conftest.py 的钩子把子进程的 stdout/stderr 落到这个文件。
      # 理由：库用 stderr=PIPE 起 Chrome 却从不读那个管道
      # （local_browser_watchdog.py:146-151），Chrome 的死因就是这么丢的。
      ECOM_AGENT_CAPTURE_CHROME_LOG: /tmp/chrome_capture.log
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip

      - name: 安装
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: 装 Chromium 依赖（失败继续，不影响后续步骤的结论）
        run: |
          sudo apt-get update -qq || true
          sudo apt-get install -y -qq libnss3 libatk-bridge2.0-0 libgtk-3-0 \
            libgbm1 libasound2t64 fonts-noto-cjk || true

      # ★ 先把"环境坏了"和"代码坏了"分开，再跑测试。
      #   没有这一步的话，两种失败在下游长得一模一样：都是 pytest 红一片，
      #   而排查方向完全相反 —— 一个要去改 runner，一个要去改代码。
      #   探测结果用 ::notice:: / ::warning:: / ::error:: 抬成注解，这样它和失败原因一样是公开可读的。
      #
      # ★ 为什么探的是 devtools/probe_browser.py 而不是几行 inline python：
      #   第一版探针只回答了"Chrome 在不在"（答案：在），然后测试照样红，
      #   注解只给到一句 local_browser_watchdog.py:428 的 RuntimeError。
      #   去读库源码才知道为什么补 traceback 没用：
      #     · 那个 RuntimeError 的消息是【硬编码】的通用提示（"可能要 --no-sandbox"），
      #       把 --tb=short 改成 --tb=long 只是把一句我已经读过源码的话打全；
      #     · Chrome 是用 stderr=PIPE 起的（local_browser_watchdog.py:150），
      #       而全库【没有任何一行读这个管道】—— 死因被接了管道却没人听。
      #   所以探针改成"按同样的二进制、同样的 get_args() 自己起一次，自己读 stderr"。
      #   这份脚本本地也能跑，且用的是和测试同一条 Chrome 解析顺序（config.CHROME_PATH）。
      - name: 探测浏览器（把"环境坏了"和"代码坏了"分开）
        run: python devtools/probe_browser.py

      - name: 跑浏览器测试
        id: browser_tests
        run: |
          set +e
          # ★ 与 offline job 同款参数，理由见那边（-rf 保证失败清单落在 tail 里；
          #   ⚠️ 那边还记了一件事：--tb=long 解不开 "...<N lines>...",
          #   那是 Python 自己干的，不是 pytest）。
          python -m pytest -v -m "needs_browser" --tb=long -rf 2>&1 | tee /tmp/pytest_browser.log
          code=${PIPESTATUS[0]}
          set -e

          # ★ 失败原因抬成注解 —— 理由同 offline job 那一段。
          #   顺带一个真实的、找了我半天的教训：这个 job 第一次在 CI 上红的时候，
          #   公开 run 页面上只有 "Process completed with exit code 1"，
          #   日志接口回 403 "Must have admin rights to Repository"，
          #   job summary 压根不进公开 HTML。也就是说这份 workflow 当时
          #   把一个它自己都无法解释的失败推给了所有看客。
          #   可观测性不是"日志写得详细"，是【看的人拿得到】。
          if [ "$code" -ne 0 ] && [ "$code" -ne 5 ]; then
            MSG=$(tail -n 80 /tmp/pytest_browser.log | sed -e 's/%/%25/g' -e 's/\r//g' | awk '{printf "%s%%0A", $0}')
            echo "::error::needs_browser 测试失败（退出码 ${code}）。最后 80 行：${MSG}"
          fi

          # ★★ 无论绿红，都报一句【到底跑了几条】。
          #   为什么必要：这个 job 是 continue-on-error，"8 条全过"和
          #   "一条都没收集到"（退出码 5）在 step 层面【都是 success】——
          #   同一种颜色代表两种截然相反的状态，正是这个 job 最该避免的病。
          #   pytest 末行的 summary（"8 passed in 12.34s"）是唯一能区分二者的东西，
          #   把它抬成公开注解，"绿"这个字以后才有确定含义。
          #   用 -rf 的副作用之一也在这里：失败清单落在末尾，所以 tail 抓得到。
          SUMMARY=$(grep -aoE '[0-9]+ (passed|failed|error|skipped)[^=]*' /tmp/pytest_browser.log | tail -n 1)
          echo "::notice::needs_browser 实际结果：${SUMMARY:-（没抓到 summary 行 —— 存疑，别当成绿）}；退出码 ${code}"

          # ★ 必须显式区分退出码 5（未收集到任何用例）和 1（用例真的失败了）。
          #
          #   踩过的坑：Phase 0 时仓库里还没有任何 needs_browser 用例，pytest 退出码 5
          #   让这个 job 变红 —— 看起来和"Chromium 装不上"一模一样，
          #   但根因完全不同（一个是不该修，一个是环境问题）。
          #   在 CI 上，"红的原因不可分辨"比"红"本身更有害：它会训练人忽略这个 job。
          if [ "$code" -eq 5 ]; then
            echo "::notice::还没有 needs_browser 用例（Phase 2 的 spike 会补上）。退出码 5 = 未收集到用例，不算失败。"
            exit 0
          fi
          exit "$code"

      # ★ 把库丢弃的 Chrome 输出抬成注解（截获机制见 tests/conftest.py 的 _capture_child_process_stdio）。
      #
      #   为什么值得单独一步、而不是塞进上一步的 tail：
      #   上一段 tail 的是【pytest 的输出】，而 Chrome 的死因从来不在那里 ——
      #   它被接进了一个没人读的管道。这份捕获文件是唯一能看到它的地方，
      #   所以它必须自己走一条注解，不能被 pytest 的 tail 顺带。
      #
      #   ★ if 条件里那个 outcome == 'failure' 不是装饰：
      #     不加的话，每次绿跑也会在公开页面上留一条 error 注解 ——
      #     而"注解区里总有红字"正是让人开始忽略注解的第一步，
      #     这个通道就自己把自己废掉了。
      - name: 把 Chrome 自己的输出抬成注解（库接了管道，却从不读它）
        if: always() && steps.browser_tests.outcome == 'failure'
        run: |
          F=/tmp/chrome_capture.log
          if [ -s "$F" ]; then
            N=$(grep -c '>>> 第 ' "$F" || true)
            # ★ 不用 tail。实测踩过：Chrome 崩溃时 stderr 末尾几十行全是栈帧
            #   （#0..#19 加一整排寄存器），真正的死因（那行 FATAL / Check failed）
            #   在栈【前面】，正好被 tail 挤出去。
            #   tail 对"人写的日志"好用，对"崩溃转储"恰恰相反：越靠后越没信息量。
            D=$(grep -aE 'FATAL|Check failed|Received signal|zygote|sandbox' "$F" | sort -u | head -n 8 || true)
            MSG=$(printf '%s\n' "$D" | sed -e 's/%/%25/g' -e 's/\r//g' | awk '{printf "%s%%0A", $0}')
            echo "::error::Chrome 死因行（库把它接进 PIPE 却从不读，所以这份只在此外存在）。共捕获 ${N} 次子进程启动：${MSG}"
          else
            echo "::notice::没有捕获到任何子进程输出 —— 说明库根本没走到起 Chrome 那一步，故障在更上游"
          fi

      - name: 把结论写进 job summary（即使失败也执行）
        if: always()
        run: |
          {
            echo "### 浏览器门禁"
            echo ""
            echo "本 job 是 \`continue-on-error: true\`，红不代表代码坏了。"
            echo "本地必须过：\`pytest -m needs_browser\`"
            echo ""
            echo "★ 失败原因在【本页的 Annotations 面板】里，不在日志里 ——"
            echo "日志接口要 admin 权限（公开仓库也一样），job summary 不进公开 HTML，"
            echo "注解是这个仓库唯一公开可读的失败通道。"
          } >> "$GITHUB_STEP_SUMMARY"
